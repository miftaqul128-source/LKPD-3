<html>
    <head>
        <title>LKPD 3-tabel</title>
    </head>
    <body>
        <h2>tabel piket x acp</h2>
        <table border="1">
            <tr> <!--baris pertama-->
                <th rowspan="2">hari</th>
                <th colspan="2">tugas piket</th>
            </tr>
            <tr> <!--baris kedua-->
                <th>menyapu</th>
                <th>menghapus papan</th>
            </tr>
            <tr> <!--baris ketiga-->
                <th>senin</th>
                <th>zahra</th>
                <th>intana</th>
            </tr>
            <tr> <!--baris keempat-->
                <th>selasa</th>
                <th>syifa</th>
                <th>hasna</th>
            </tr>
            <tr> <!--baris ke lima-->
                <th>rabu</th>
                <th>hawa</th>
                <th>arisma</th>
            </tr>
            <tr> <!--baris keenam-->
                <th>kamis</th>
                <th>naila</th>
                <th>dapi</th>
            </tr>
            <tr><!--baris ketujuh-->
                <th>jumat</th>
                <th>rizky</th>
                <th>diah</th>
            </tr>
            </tr>
        </table>
    </body>
</html>
